<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #C4F82A; } a:hover { color: #A8E000; }
    .brand { font-family: "Poppins","Quicksand",sans-serif; }
    .ui { font-family: "Inter",system-ui,sans-serif; }
  </style>
</helmet>

<div style="width: 900px; height: 560px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0A0B; color: #FFFFFF;">
  <!-- ambient brand glow -->
  <div style="position: absolute; top: -140px; right: -120px; width: 460px; height: 460px; border-radius: 999px; background: radial-gradient(circle, rgba(178,232,46,0.30) 0%, transparent 70%); pointer-events: none;"></div>

  <div style="position: relative; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 56px; padding: 0 64px; box-sizing: border-box;">

    <!-- Hero lockup -->
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 26px;">
        <svg width="88" height="88" viewBox="0 0 120 120" fill="none" aria-label="RideInSync mark">
          <polyline points="22,30 56,60 22,90" stroke="#3A3A3C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></polyline>
          <polyline points="44,30 78,60 44,90" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></polyline>
          <polyline points="66,30 100,60 66,90" stroke="#C4F82A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></polyline>
        </svg>
        <div class="brand" style="font-size: 58px; font-weight: 600; letter-spacing: -0.01em; line-height: 1;">RideInSync</div>
      </div>
      <div class="ui" style="font-size: 16px; color: #9A9A9E; margin-left: 114px;">Ride as a group, not a scatter.</div>
    </div>

    <!-- Logo forms -->
    <div style="display: flex; align-items: flex-start; gap: 40px;">

      <!-- App icon -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
        <div style="width: 120px; height: 120px; border-radius: 30px; background: #141416; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 0 44px 6px rgba(178,232,46,0.28); display: grid; place-items: center;">
          <svg width="72" height="72" viewBox="0 0 120 120" fill="none">
            <polyline points="22,30 56,60 22,90" stroke="#3A3A3C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></polyline>
            <polyline points="44,30 78,60 44,90" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></polyline>
            <polyline points="66,30 100,60 66,90" stroke="#C4F82A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></polyline>
          </svg>
        </div>
        <div class="ui" style="font-size: 12px; color: #6B6B70;">App icon</div>
      </div>

      <!-- Reversed / on-accent -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
        <div style="width: 120px; height: 120px; border-radius: 30px; background: #C4F82A; display: grid; place-items: center;">
          <svg width="72" height="72" viewBox="0 0 120 120" fill="none">
            <polyline points="22,30 56,60 22,90" stroke="rgba(10,10,11,0.32)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></polyline>
            <polyline points="44,30 78,60 44,90" stroke="rgba(10,10,11,0.60)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></polyline>
            <polyline points="66,30 100,60 66,90" stroke="#0A0A0B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></polyline>
          </svg>
        </div>
        <div class="ui" style="font-size: 12px; color: #6B6B70;">Reversed</div>
      </div>

      <!-- Stacked lockup -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
        <div style="width: 200px; height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;">
          <svg width="56" height="56" viewBox="0 0 120 120" fill="none">
            <polyline points="22,30 56,60 22,90" stroke="#3A3A3C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></polyline>
            <polyline points="44,30 78,60 44,90" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></polyline>
            <polyline points="66,30 100,60 66,90" stroke="#C4F82A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></polyline>
          </svg>
          <div class="brand" style="font-size: 24px; font-weight: 600; letter-spacing: -0.01em;">RideInSync</div>
        </div>
        <div class="ui" style="font-size: 12px; color: #6B6B70;">Stacked</div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
