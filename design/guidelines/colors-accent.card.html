<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--color-bg-base);color:var(--color-text-primary);font-family:var(--font-ui);padding:20px;box-sizing:border-box}.sw{display:flex;gap:14px;flex-wrap:wrap}.c{flex:1;min-width:120px}.chip{height:64px;border-radius:12px;margin-bottom:8px}.n{font-size:13px;font-weight:600}.h{font-size:12px;color:var(--color-text-secondary);font-variant-numeric:tabular-nums}</style></head><body>
<div class="sw">
<div class="c"><div class="chip" style="background:var(--color-accent)"></div><div class="n">accent</div><div class="h">#C4F82A</div></div>
<div class="c"><div class="chip" style="background:var(--color-accent-bright)"></div><div class="n">accent-bright</div><div class="h">#C9FF3D</div></div>
<div class="c"><div class="chip" style="background:var(--color-accent-deep)"></div><div class="n">accent-deep</div><div class="h">#A8E000</div></div>
<div class="c"><div class="chip" style="background:radial-gradient(circle at 50% 50%,var(--color-accent-glow),transparent 70%),var(--color-bg-void)"></div><div class="n">accent-glow</div><div class="h">rgba(178,232,46,.35)</div></div>
</div></body></html>
