<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces — dark scale" subtitle="Each step one shade lifted; depth via tinting not shadow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--color-bg-base);color:var(--color-text-primary);font-family:var(--font-ui);padding:20px;box-sizing:border-box}.sw{display:flex;gap:10px;flex-wrap:wrap}.c{flex:1;min-width:96px}.chip{height:64px;border-radius:12px;margin-bottom:8px;border:1px solid var(--color-divider)}.n{font-size:12px;font-weight:600}.h{font-size:11px;color:var(--color-text-secondary);font-variant-numeric:tabular-nums}</style></head><body>
<div class="sw">
<div class="c"><div class="chip" style="background:var(--color-bg-void)"></div><div class="n">bg-void</div><div class="h">#000000</div></div>
<div class="c"><div class="chip" style="background:var(--color-bg-base)"></div><div class="n">bg-base</div><div class="h">#0A0A0B</div></div>
<div class="c"><div class="chip" style="background:var(--color-surface-1)"></div><div class="n">surface-1</div><div class="h">#141416</div></div>
<div class="c"><div class="chip" style="background:var(--color-surface-2)"></div><div class="n">surface-2</div><div class="h">#1C1C1E</div></div>
<div class="c"><div class="chip" style="background:var(--color-surface-3)"></div><div class="n">surface-3</div><div class="h">#2A2A2D</div></div>
<div class="c"><div class="chip" style="background:var(--color-surface-4)"></div><div class="n">surface-4</div><div class="h">#3A3A3C</div></div>
</div></body></html>
