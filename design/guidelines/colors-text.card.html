<!-- @dsCard group="Colors" viewport="700x160" name="Text & utility" subtitle="White-on-black hierarchy, on-accent, dividers" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--color-bg-base);color:var(--color-text-primary);font-family:var(--font-ui);padding:20px;box-sizing:border-box}.rows{display:flex;flex-direction:column;gap:6px}.r{display:flex;align-items:center;gap:14px}.sw{width:40px;height:24px;border-radius:6px;border:1px solid var(--color-divider);flex:none}.lbl{font-size:14px}.h{margin-left:auto;font-size:12px;color:var(--color-text-secondary);font-variant-numeric:tabular-nums}</style></head><body>
<div class="rows">
<div class="r"><span class="sw" style="background:var(--color-text-primary)"></span><span class="lbl" style="color:var(--color-text-primary)">text-primary — headings, values</span><span class="h">#FFFFFF</span></div>
<div class="r"><span class="sw" style="background:var(--color-text-secondary)"></span><span class="lbl" style="color:var(--color-text-secondary)">text-secondary — sub-labels</span><span class="h">#9A9A9E</span></div>
<div class="r"><span class="sw" style="background:var(--color-text-tertiary)"></span><span class="lbl" style="color:var(--color-text-tertiary)">text-tertiary — placeholder / disabled</span><span class="h">#6B6B70</span></div>
<div class="r"><span class="sw" style="background:var(--color-accent);color:var(--color-text-on-accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">Aa</span><span class="lbl">text-on-accent — near-black on lime</span><span class="h">#0A0A0B</span></div>
</div></body></html>
