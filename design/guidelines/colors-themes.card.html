<!-- @dsCard group="Colors" viewport="700x200" name="Dark & light themes" subtitle="Dark-first default; [data-theme=light] inverts surfaces, accent holds" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--font-ui);display:flex;gap:16px;padding:20px;box-sizing:border-box}
.pane{flex:1;border-radius:16px;padding:18px;background:var(--color-bg-base);color:var(--color-text-primary);box-shadow:var(--shadow-card)}
.chip{display:inline-block;width:30px;height:30px;border-radius:8px;border:1px solid var(--color-divider);margin-right:6px;vertical-align:middle}
.card{margin-top:12px;background:var(--color-surface-2);border-radius:12px;padding:10px 12px;font-size:13px}
.btn{display:inline-block;margin-top:10px;padding:8px 16px;border-radius:999px;background:var(--color-accent);color:var(--color-text-on-accent);font-size:13px;font-weight:600}
.lbl{font-size:12px;color:var(--color-text-secondary);margin-bottom:8px}</style></head><body>
<div class="pane"><div class="lbl">Dark (default)</div>
<span class="chip" style="background:var(--color-surface-1)"></span><span class="chip" style="background:var(--color-surface-3)"></span><span class="chip" style="background:var(--color-accent)"></span>
<div class="card">Surface card · secondary text</div><span class="btn">Next</span></div>
<div class="pane" data-theme="light"><div class="lbl">Light — [data-theme="light"]</div>
<span class="chip" style="background:var(--color-surface-1)"></span><span class="chip" style="background:var(--color-surface-3)"></span><span class="chip" style="background:var(--color-accent)"></span>
<div class="card">Surface card · secondary text</div><span class="btn">Next</span></div>
</body></html>
