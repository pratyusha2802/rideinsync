<!-- @dsCard group="Spacing" viewport="700x160" name="Radius & elevation" subtitle="Pills + soft 16–20px corners; depth via glow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--color-bg-base);color:var(--color-text-primary);font-family:var(--font-ui);padding:20px;box-sizing:border-box}.sw{display:flex;gap:18px;align-items:flex-end}.b{background:var(--color-surface-2);border:1px solid var(--color-divider);width:88px;height:64px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:11px;color:var(--color-text-secondary)}</style></head><body>
<div class="sw">
<div class="b" style="border-radius:12px">sm 12</div>
<div class="b" style="border-radius:16px">md 16</div>
<div class="b" style="border-radius:20px">lg 20</div>
<div class="b" style="border-radius:999px;width:120px">full 999</div>
<div class="b" style="border-radius:16px;box-shadow:var(--shadow-card);border-color:transparent">shadow-card</div>
<div class="b" style="border-radius:16px;box-shadow:0 0 40px 6px var(--color-accent-glow);border-color:transparent">glow</div>
</div></body></html>
