<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale — 4px base" subtitle="8px working rhythm; tokens 2xs → 2xl" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--color-bg-base);color:var(--color-text-primary);font-family:var(--font-ui);padding:20px;box-sizing:border-box}.row{display:flex;align-items:center;gap:14px;margin-bottom:8px}.bar{height:14px;background:var(--color-accent);border-radius:3px}.t{font-size:12px;width:120px;color:var(--color-text-secondary)}</style></head><body>
<div>
<div class="row"><span class="t">2xs · 4px</span><span class="bar" style="width:4px"></span></div>
<div class="row"><span class="t">xs · 8px</span><span class="bar" style="width:8px"></span></div>
<div class="row"><span class="t">sm · 12px</span><span class="bar" style="width:12px"></span></div>
<div class="row"><span class="t">md · 16px</span><span class="bar" style="width:16px"></span></div>
<div class="row"><span class="t">lg · 24px</span><span class="bar" style="width:24px"></span></div>
<div class="row"><span class="t">xl · 32px</span><span class="bar" style="width:32px"></span></div>
<div class="row"><span class="t">2xl · 48px</span><span class="bar" style="width:48px"></span></div>
</div></body></html>
