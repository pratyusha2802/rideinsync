<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{display:flex}
.main{flex:0 0 75%;background:var(--color-bg-void);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.glow{position:absolute;top:-120px;right:-100px;width:640px;height:640px;background:radial-gradient(circle,var(--color-accent-glow),transparent 65%)}
.wm{font-family:var(--font-brand);font-weight:600;letter-spacing:-.02em;color:var(--color-accent);font-size:118px;position:relative;line-height:1;text-align:center}
.strip{flex:1;display:flex;flex-direction:column}.strip>div{flex:1}
</style></head><body>
<div class="main"><div class="glow"></div><div class="wm">RideInSync</div></div>
<div class="strip">
<div style="background:var(--color-accent-bright)"></div>
<div style="background:var(--color-accent)"></div>
<div style="background:var(--color-accent-deep)"></div>
</div></body></html>
