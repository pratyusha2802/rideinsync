<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%}body{background:radial-gradient(circle at 70% 20%,#141416,var(--color-bg-void));display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-ui)}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react" src="PhoneFrame.jsx"></script>
<script type="text/babel" data-presets="react" src="Splash.jsx"></script>
<script type="text/babel" data-presets="react" src="Onboarding.jsx"></script>
<script type="text/babel" data-presets="react" src="Preferences.jsx"></script>
<script type="text/babel" data-presets="react" src="Voice.jsx"></script>
<script type="text/babel" data-presets="react" src="MiniMap.jsx"></script>
<script type="text/babel" data-presets="react" src="RoutePreview.jsx"></script>

<script type="text/babel" data-presets="react" src="App.jsx"></script>
<script type="text/babel" data-presets="react">
function ThemeShell(){
  const [light,setLight]=React.useState(false);
  return <div data-theme={light?'light':undefined} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:20}}>
    <div onClick={()=>setLight(!light)} role="button" style={{cursor:'pointer',display:'inline-flex',alignItems:'center',gap:8,padding:'8px 14px',borderRadius:999,
      background:'var(--color-surface-2)',color:'var(--color-text-primary)',border:'1px solid var(--color-divider)',fontSize:13,fontWeight:600,fontFamily:'var(--font-ui)'}}>
      <span style={{width:14,height:14,borderRadius:999,background:'var(--color-accent)'}}/>{light?'Light theme':'Dark theme'} · tap to switch
    </div>
    <window.App/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<ThemeShell/>);
</script>
</body></html>
